<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Creator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e4e4e7;
      line-height: 1.5;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { margin-bottom: 8px; font-size: 1.8rem; }
    .subtitle { color: #a1a1aa; margin-bottom: 24px; font-size: 0.95rem; }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #a1a1aa;
      margin-bottom: 4px;
      margin-top: 12px;
    }
    label:first-child { margin-top: 0; }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #e4e4e7;
      font-size: 0.95rem;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #71717a;
    }
    textarea { min-height: 80px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #27272a; color: #e4e4e7; }
    .btn-secondary:hover { background: #3f3f46; }
    .btn-danger { background: #7f1d1d; color: #fecaca; }
    .btn-danger:hover { background: #991b1b; }
    .btn-success { background: #22c55e; color: white; }
    .btn-success:hover { background: #16a34a; }
    #result {
      display: none;
      white-space: pre-wrap;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      font-family: ui-monospace, monospace;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    #savedList { margin-top: 12px; }
    .saved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .saved-item span { cursor: pointer; }
    .saved-item span:hover { color: #93c5fd; }
    .small { font-size: 0.8rem; color: #71717a; margin-top: 8px; }
    
    /* Image upload styles */
    .image-upload-area {
      border: 2px dashed #3f3f46;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-top: 8px;
      cursor: pointer;
      transition: border-color 0.3s;
      background: #09090b;
    }
    .image-upload-area:hover {
      border-color: #3b82f6;
    }
    .image-upload-area input[type="file"] {
      display: none;
    }
    .image-preview {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      margin: 10px auto;
      display: block;
    }
    .image-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }
    .saved-item-content {
      display: flex;
      align-items: center;
      flex: 1;
    }
    .character-thumbnail {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 10px;
      background: #27272a;
    }

    /* Hidden canvas for image generation */
    #characterCardCanvas {
      display: none;
    }
  </style>
</head>
<body>

  <h1>Character Creator</h1>
  <p class="subtitle">Private tool • Data stays only in your browser</p>

  <div class="card">
    <div class="row">
      <div>
        <label>Name</label>
        <input type="text" id="name" placeholder="Character name">
      </div>
      <div>
        <label>Age</label>
        <input type="text" id="age" placeholder="e.g. 27 or Unknown">
      </div>
    </div>

    <!-- Image Upload Section -->
    <label>Character Image</label>
    <div class="image-upload-area" id="imageUploadArea">
      <input type="file" id="imageInput" accept="image/*">
      <div id="imagePlaceholder">
        <p style="color: #71717a; margin: 0;">Click to upload character image</p>
        <p style="color: #71717a; font-size: 0.8rem; margin: 4px 0;">JPG, PNG, GIF supported</p>
      </div>
      <img id="imagePreview" class="image-preview" style="display: none;" alt="Character preview">
    </div>
    <div class="image-actions">
      <button class="btn-secondary" onclick="removeImage()" style="padding: 4px 12px; font-size: 0.8rem;">Remove Image</button>
    </div>

    <label>Role / Occupation</label>
    <input type="text" id="role" placeholder="e.g. Pirate navigator, Cult priest, Survivor medic">

    <label>Personality & Traits</label>
    <textarea id="personality" placeholder="Key traits, habits, strengths, flaws..."></textarea>

    <label>Appearance</label>
    <textarea id="appearance" placeholder="Face, body, clothing, distinctive features..."></textarea>

    <label>Backstory (short)</label>
    <textarea id="backstory" placeholder="Important past events..."></textarea>

    <label>Secrets</label>
    <textarea id="secrets" placeholder="Things they hide from others..."></textarea>

    <label>How they speak</label>
    <textarea id="speech" placeholder="Tone, vocabulary, catchphrases, accent..."></textarea>

    <label>Relationships</label>
    <textarea id="relationships" placeholder="How they feel about other characters..."></textarea>

    <label>Current Goal / Mood</label>
    <textarea id="goal" placeholder="What they want right now + current emotional state..."></textarea>

    <label>Extra Notes</label>
    <textarea id="notes" placeholder="Anything else..."></textarea>

    <div class="buttons">
      <button class="btn-primary" onclick="generate()">Generate Character Sheet</button>
      <button class="btn-success" onclick="downloadCharacterImage()">📥 Download as Image</button>
      <button class="btn-secondary" onclick="saveCharacter()">Save Character</button>
      <button class="btn-secondary" onclick="clearForm()">Clear Form</button>
    </div>

    <div id="result"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom: 12px;">Saved Characters</h3>
    <div id="savedList"></div>
    <p class="small">Characters are saved only in this browser. Clearing browser data will delete them.</p>
  </div>

  <!-- Hidden canvas for generating character card image -->
  <canvas id="characterCardCanvas"></canvas>

  <script>
    let currentImageData = null;

    // Image upload handling
    document.getElementById('imageUploadArea').addEventListener('click', function(e) {
      if (e.target.tagName !== 'BUTTON') {
        document.getElementById('imageInput').click();
      }
    });

    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          currentImageData = event.target.result;
          showImagePreview(currentImageData);
        };
        reader.readAsDataURL(file);
      }
    });

    function showImagePreview(imageData) {
      const preview = document.getElementById('imagePreview');
      const placeholder = document.getElementById('imagePlaceholder');
      preview.src = imageData;
      preview.style.display = 'block';
      placeholder.style.display = 'none';
    }

    function removeImage() {
      currentImageData = null;
      const preview = document.getElementById('imagePreview');
      const placeholder = document.getElementById('imagePlaceholder');
      preview.style.display = 'none';
      preview.src = '';
      placeholder.style.display = 'block';
      document.getElementById('imageInput').value = '';
    }

    function getCharacterData() {
      return {
        name: document.getElementById('name').value.trim() || 'Unnamed',
        age: document.getElementById('age').value.trim() || '—',
        role: document.getElementById('role').value.trim() || '—',
        personality: document.getElementById('personality').value.trim() || '—',
        appearance: document.getElementById('appearance').value.trim() || '—',
        backstory: document.getElementById('backstory').value.trim() || '—',
        secrets: document.getElementById('secrets').value.trim() || '—',
        speech: document.getElementById('speech').value.trim() || '—',
        relationships: document.getElementById('relationships').value.trim() || '—',
        goal: document.getElementById('goal').value.trim() || '—',
        notes: document.getElementById('notes').value.trim() || '—',
        image: currentImageData
      };
    }

    function generate() {
      const char = getCharacterData();
      
      let text = `==============================
CHARACTER SHEET
==============================

Name:          ${char.name}
Age:           ${char.age}
Role:          ${char.role}

Personality & Traits:
${char.personality}

Appearance:
${char.appearance}

Backstory:
${char.backstory}

Secrets:
${char.secrets}

How they speak:
${char.speech}

Relationships:
${char.relationships}

Current Goal / Mood:
${char.goal}

Extra Notes:
${char.notes}

==============================`;

      const result = document.getElementById('result');
      result.style.display = 'block';
      
      if (char.image) {
        result.innerHTML = `<img src="${char.image}" style="max-width: 150px; border-radius: 8px; margin-bottom: 10px; display: block;">\n${text}`;
      } else {
        result.textContent = text;
      }
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let currentLine = '';
      let lines = [];
      
      for (let word of words) {
        const testLine = currentLine + word + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && currentLine !== '') {
          lines.push(currentLine.trim());
          currentLine = word + ' ';
        } else {
          currentLine = testLine;
        }
      }
      lines.push(currentLine.trim());
      
      for (let line of lines) {
        ctx.fillText(line, x, y);
        y += lineHeight;
      }
      return y;
    }

    function drawCharacterCard(char) {
      const canvas = document.getElementById('characterCardCanvas');
      const ctx = canvas.getContext('2d');
      
      // Set canvas size
      const width = 1000;
      const height = 1400;
      canvas.width = width;
      canvas.height = height;
      
      // Background with gradient
      const gradient = ctx.createLinearGradient(0, 0, width * 0.3, height);
      gradient.addColorStop(0, '#0f0c29');
      gradient.addColorStop(0.5, '#302b63');
      gradient.addColorStop(1, '#24243e');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
      
      // Decorative background elements
      ctx.globalAlpha = 0.05;
      ctx.fillStyle = '#8b5cf6';
      ctx.font = '300px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('✦', width * 0.1, height * 0.8);
      ctx.fillText('✦', width * 0.9, height * 0.2);
      ctx.globalAlpha = 1;
      
      // Outer border glow
      ctx.shadowColor = 'rgba(139, 92, 246, 0.3)';
      ctx.shadowBlur = 20;
      ctx.strokeStyle = 'rgba(139, 92, 246, 0.3)';
      ctx.lineWidth = 2;
      ctx.strokeRect(20, 20, width - 40, height - 40);
      ctx.shadowBlur = 0;
      
      // Inner border
      ctx.strokeStyle = 'rgba(139, 92, 246, 0.1)';
      ctx.lineWidth = 1;
      ctx.strokeRect(30, 30, width - 60, height - 60);
      
      // Decorative corner accents
      ctx.strokeStyle = '#8b5cf6';
      ctx.lineWidth = 3;
      const cornerSize = 30;
      // Top left
      ctx.beginPath();
      ctx.moveTo(30 + cornerSize, 30);
      ctx.lineTo(30, 30);
      ctx.lineTo(30, 30 + cornerSize);
      ctx.stroke();
      // Top right
      ctx.beginPath();
      ctx.moveTo(width - 30 - cornerSize, 30);
      ctx.lineTo(width - 30, 30);
      ctx.lineTo(width - 30, 30 + cornerSize);
      ctx.stroke();
      // Bottom left
      ctx.beginPath();
      ctx.moveTo(30 + cornerSize, height - 30);
      ctx.lineTo(30, height - 30);
      ctx.lineTo(30, height - 30 - cornerSize);
      ctx.stroke();
      // Bottom right
      ctx.beginPath();
      ctx.moveTo(width - 30 - cornerSize, height - 30);
      ctx.lineTo(width - 30, height - 30);
      ctx.lineTo(width - 30, height - 30 - cornerSize);
      ctx.stroke();
      
      // Header background
      const headerGradient = ctx.createLinearGradient(0, 0, width, 0);
      headerGradient.addColorStop(0, 'rgba(139, 92, 246, 0.2)');
      headerGradient.addColorStop(0.5, 'rgba(59, 130, 246, 0.2)');
      headerGradient.addColorStop(1, 'rgba(139, 92, 246, 0.2)');
      ctx.fillStyle = headerGradient;
      ctx.fillRect(40, 40, width - 80, 120);
      
      // Title
      ctx.shadowColor = 'rgba(139, 92, 246, 0.5)';
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 52px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚔ CHARACTER SHEET ⚔', width/2, 120);
      ctx.shadowBlur = 0;
      
      // Decorative line under title
      ctx.strokeStyle = 'rgba(139, 92, 246, 0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(width/2 - 200, 135);
      ctx.lineTo(width/2 + 200, 135);
      ctx.stroke();
      
      let startY = 180;
      
      // Draw image if exists
      if (char.image) {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        
        img.onload = function() {
          // Draw image in a rectangle
          const imgWidth = 300;
          const imgHeight = 300;
          const centerX = width/2 - imgWidth/2;
          const imgY = startY;
          
          // Save context state
          ctx.save();
          
          // Shadow for image
          ctx.shadowColor = 'rgba(139, 92, 246, 0.3)';
          ctx.shadowBlur = 30;
          
          // Rounded rectangle for image
          const radius = 15;
          ctx.beginPath();
          ctx.moveTo(centerX + radius, imgY);
          ctx.lineTo(centerX + imgWidth - radius, imgY);
          ctx.quadraticCurveTo(centerX + imgWidth, imgY, centerX + imgWidth, imgY + radius);
          ctx.lineTo(centerX + imgWidth, imgY + imgHeight - radius);
          ctx.quadraticCurveTo(centerX + imgWidth, imgY + imgHeight, centerX + imgWidth - radius, imgY + imgHeight);
          ctx.lineTo(centerX + radius, imgY + imgHeight);
          ctx.quadraticCurveTo(centerX, imgY + imgHeight, centerX, imgY + imgHeight - radius);
          ctx.lineTo(centerX, imgY + radius);
          ctx.quadraticCurveTo(centerX, imgY, centerX + radius, imgY);
          ctx.closePath();
          ctx.clip();
          
          ctx.drawImage(img, centerX, imgY, imgWidth, imgHeight);
          
          // Restore context state (removes clip)
          ctx.restore();
          
          // Border around image (draw after restore)
          ctx.strokeStyle = 'rgba(139, 92, 246, 0.5)';
          ctx.lineWidth = 3;
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.moveTo(centerX + radius, imgY);
          ctx.lineTo(centerX + imgWidth - radius, imgY);
          ctx.quadraticCurveTo(centerX + imgWidth, imgY, centerX + imgWidth, imgY + radius);
          ctx.lineTo(centerX + imgWidth, imgY + imgHeight - radius);
          ctx.quadraticCurveTo(centerX + imgWidth, imgY + imgHeight, centerX + imgWidth - radius, imgY + imgHeight);
          ctx.lineTo(centerX + radius, imgY + imgHeight);
          ctx.quadraticCurveTo(centerX, imgY + imgHeight, centerX, imgY + imgHeight - radius);
          ctx.lineTo(centerX, imgY + radius);
          ctx.quadraticCurveTo(centerX, imgY, centerX + radius, imgY);
          ctx.closePath();
          ctx.stroke();
          
          // Draw the rest of the card
          drawCardContent(ctx, char, width, startY + imgHeight + 40);
          downloadCanvas(canvas, char.name);
        };
        
        img.onerror = function() {
          // If image fails to load, draw placeholder and continue
          drawPlaceholderImage(ctx, width, startY);
          drawCardContent(ctx, char, width, startY + 380);
          downloadCanvas(canvas, char.name);
        };
        
        img.src = char.image;
      } else {
        // No image - draw placeholder
        drawPlaceholderImage(ctx, width, startY);
        drawCardContent(ctx, char, width, startY + 380);
        downloadCanvas(canvas, char.name);
      }
    }

    function drawPlaceholderImage(ctx, width, startY) {
      ctx.fillStyle = 'rgba(59, 130, 246, 0.1)';
      ctx.fillRect(width/2 - 150, startY, 300, 300);
      ctx.strokeStyle = 'rgba(59, 130, 246, 0.2)';
      ctx.lineWidth = 2;
      ctx.strokeRect(width/2 - 150, startY, 300, 300);
      
      ctx.fillStyle = 'rgba(139, 92, 246, 0.3)';
      ctx.font = '80px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('👤', width/2, startY + 190);
      
      ctx.fillStyle = 'rgba(139, 92, 246, 0.2)';
      ctx.font = '18px Arial';
      ctx.fillText('No Image Uploaded', width/2, startY + 340);
    }

    function drawCardContent(ctx, char, width, startY) {
      let y = startY;
      const lineHeight = 30;
      const leftMargin = 60;
      const rightMargin = 60;
      const maxWidth = width - leftMargin - rightMargin;
      
      // Section header style
      function drawSectionHeader(text, y) {
        ctx.fillStyle = 'rgba(139, 92, 246, 0.15)';
        ctx.fillRect(leftMargin, y - 22, maxWidth, 30);
        ctx.fillStyle = '#a78bfa';
        ctx.font = 'bold 20px Georgia, serif';
        ctx.textAlign = 'left';
        ctx.fillText('▸ ' + text, leftMargin + 10, y);
        return y + 35;
      }
      
      // Draw fields with sections
      const sections = [
        { label: '📌 BASIC INFO', fields: [
          { label: 'Name:', value: char.name },
          { label: 'Age:', value: char.age },
          { label: 'Role:', value: char.role }
        ]},
        { label: '🎭 PERSONALITY & TRAITS', fields: [
          { label: '', value: char.personality }
        ]},
        { label: '👤 APPEARANCE', fields: [
          { label: '', value: char.appearance }
        ]},
        { label: '📖 BACKSTORY', fields: [
          { label: '', value: char.backstory }
        ]},
        { label: '🔮 SECRETS', fields: [
          { label: '', value: char.secrets }
        ]},
        { label: '💬 SPEECH', fields: [
          { label: '', value: char.speech }
        ]},
        { label: '🤝 RELATIONSHIPS', fields: [
          { label: '', value: char.relationships }
        ]},
        { label: '🎯 CURRENT GOAL / MOOD', fields: [
          { label: '', value: char.goal }
        ]},
        { label: '📝 EXTRA NOTES', fields: [
          { label: '', value: char.notes }
        ]}
      ];
      
      ctx.textAlign = 'left';
      
      for (let section of sections) {
        // Check if any field in section has a value
        let hasValue = false;
        for (let field of section.fields) {
          if (field.value && field.value !== '—') {
            hasValue = true;
            break;
          }
        }
        
        if (hasValue) {
          // Draw section header
          y = drawSectionHeader(section.label, y);
          
          for (let field of section.fields) {
            if (field.value && field.value !== '—') {
              if (field.label) {
                // Draw label
                ctx.font = 'bold 16px Arial';
                ctx.fillStyle = '#c4b5fd';
                ctx.fillText(field.label, leftMargin + 20, y);
                y += 28;
                
                // Draw value with wrapping
                ctx.font = '15px Arial';
                ctx.fillStyle = '#e4e4e7';
                y = wrapText(ctx, field.value, leftMargin + 40, y, maxWidth - 40, lineHeight);
                y += 8;
              } else {
                // Draw value with wrapping (no label)
                ctx.font = '15px Arial';
                ctx.fillStyle = '#e4e4e7';
                y = wrapText(ctx, field.value, leftMargin + 20, y, maxWidth - 20, lineHeight);
                y += 8;
              }
            }
          }
          y += 15; // Extra spacing between sections
        }
      }
      
      // Footer with decorative elements
      const footerY = 1320;
      
      // Decorative line
      ctx.strokeStyle = 'rgba(139, 92, 246, 0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(leftMargin, footerY);
      ctx.lineTo(width - rightMargin, footerY);
      ctx.stroke();
      
      ctx.fillStyle = '#71717a';
      ctx.font = '14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`✨ Generated: ${new Date().toLocaleString()} ✨`, width/2, footerY + 30);
      
      // Small decorative icons at bottom
      ctx.fillStyle = 'rgba(139, 92, 246, 0.1)';
      ctx.font = '20px Arial';
      ctx.fillText('✦ ✦ ✦', width/2, footerY + 60);
    }

    function downloadCanvas(canvas, name) {
      // Download the image
      const link = document.createElement('a');
      link.download = `${name}_character_sheet.png`;
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function downloadCharacterImage() {
      const char = getCharacterData();
      
      // Check if character has a name
      if (!char.name || char.name === 'Unnamed') {
        alert('Please enter a character name first.');
        return;
      }
      
      // Draw the character card
      drawCharacterCard(char);
    }

    function saveCharacter() {
      const name = document.getElementById('name').value.trim();
      if (!name) {
        alert('Please enter at least a name before saving.');
        return;
      }

      const data = {
        name,
        age: document.getElementById('age').value,
        role: document.getElementById('role').value,
        personality: document.getElementById('personality').value,
        appearance: document.getElementById('appearance').value,
        backstory: document.getElementById('backstory').value,
        secrets: document.getElementById('secrets').value,
        speech: document.getElementById('speech').value,
        relationships: document.getElementById('relationships').value,
        goal: document.getElementById('goal').value,
        notes: document.getElementById('notes').value,
        image: currentImageData,
        savedAt: new Date().toLocaleString()
      };

      let saved = JSON.parse(localStorage.getItem('characters') || '[]');
      saved = saved.filter(c => c.name !== name);
      saved.push(data);
      localStorage.setItem('characters', JSON.stringify(saved));
      renderSaved();
      alert('Character saved!');
    }

    function loadCharacter(name) {
      const saved = JSON.parse(localStorage.getItem('characters') || '[]');
      const char = saved.find(c => c.name === name);
      if (!char) return;

      document.getElementById('name').value = char.name || '';
      document.getElementById('age').value = char.age || '';
      document.getElementById('role').value = char.role || '';
      document.getElementById('personality').value = char.personality || '';
      document.getElementById('appearance').value = char.appearance || '';
      document.getElementById('backstory').value = char.backstory || '';
      document.getElementById('secrets').value = char.secrets || '';
      document.getElementById('speech').value = char.speech || '';
      document.getElementById('relationships').value = char.relationships || '';
      document.getElementById('goal').value = char.goal || '';
      document.getElementById('notes').value = char.notes || '';
      
      if (char.image) {
        currentImageData = char.image;
        showImagePreview(char.image);
      } else {
        removeImage();
      }
      
      generate();
    }

    function deleteCharacter(name) {
      if (!confirm(`Delete character "${name}"?`)) return;
      let saved = JSON.parse(localStorage.getItem('characters') || '[]');
      saved = saved.filter(c => c.name !== name);
      localStorage.setItem('characters', JSON.stringify(saved));
      renderSaved();
    }

    function renderSaved() {
      const saved = JSON.parse(localStorage.getItem('characters') || '[]');
      const list = document.getElementById('savedList');
      if (saved.length === 0) {
        list.innerHTML = '<p style="color:#71717a">No saved characters yet.</p>';
        return;
      }
      list.innerHTML = saved.map(c => `
        <div class="saved-item">
          <div class="saved-item-content" onclick="loadCharacter('${c.name.replace(/'/g, "\\'")}')">
            ${c.image ? `<img src="${c.image}" class="character-thumbnail" alt="${c.name}">` : `<div class="character-thumbnail" style="display: flex; align-items: center; justify-content: center; background: #3f3f46; color: #a1a1aa; font-size: 0.7rem;">No img</div>`}
            <span>${c.name}</span>
          </div>
          <button class="btn-danger" style="padding:4px 10px;font-size:0.8rem" onclick="deleteCharacter('${c.name.replace(/'/g, "\\'")}')">Delete</button>
        </div>
      `).join('');
    }

    function clearForm() {
      document.querySelectorAll('input, textarea').forEach(el => el.value = '');
      removeImage();
      document.getElementById('result').style.display = 'none';
    }

    // Load saved list on start
    renderSaved();
  </script>
</body>
</html>
